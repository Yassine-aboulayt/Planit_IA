<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLANIT AI | Nouveau projet</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="js/validation.js" defer></script>
    <script src="js/prompt.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
  </head>
  <body>
    <header
      id="menu"
      class="bg-sky-100 flex flex-wrap p-5 items-center justify-between"
    >
      <img
        src="/data/Logo minimaliste PLANIT IA.png"
        alt="Logo Planit IA"
        width="120px"
      />
      <nav>
        <ul class="flex flex-wrap gap-5">
          <li class="rounded-sm font-bold px-4 py-2">
            <a href="/index.html">Dashboard</a>
          </li>
          <li class="rounded-sm font-bold px-4 py-2">
            <a href="/new-project.html">Nouveau Projet</a>
          </li>
          <li>
            <button
              id="parametre-ia"
              type="button"
              class="rounded-lg bg-blue-600 px-4 py-2 text-white"
            >
              Param�tres IA
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <main class="bg-slate-50 p-4">
      <section
        class="p-5 mx-auto my-6 max-w-3xl rounded-xl border border-slate-200 bg-white shadow-sm"
      >
        <h1 class="mb-4 text-xl font-bold">Nouveau projet</h1>
        <form id="project-form" novalidate>
          <label for="project-name" class="block">Nom du projet</label>
          <input
            id="project-name"
            type="text"
            required
            class="border p-2 w-full rounded-md border-slate-300"
          />
          <p id="name-error" class="text-red-600"></p>

          <label for="description" class="mt-3 block">Description</label>
          <textarea
            id="description"
            required
            class="border p-2 w-full rounded-md border-slate-300"
          ></textarea>
          <p id="description-error" class="text-red-600"></p>

          <label for="brief" class="mt-3 block">Brief complet</label>
          <textarea
            id="brief"
            rows="4"
            required
            class="border p-2 w-full rounded-md border-slate-300"
          ></textarea>
          <p id="brief-error" class="text-red-600"></p>
          <label for="duration" class="mt-3 block">Dur�e en jours</label>
          <input
            id="duration"
            type="number"
            min="1"
            step="1"
            required
            class="border p-2 w-full rounded-md border-slate-300"
          />
          <p id="duration-error" class="text-red-600"></p>
          <label for="developers" class="mt-3 block"
            >Nombre de d�veloppeurs</label
          >
          <input
            id="developers"
            type="number"
            min="1"
            step="1"
            required
            class="border p-2 w-full rounded-md border-slate-300"
          />
          <p id="developers-error" class="text-red-600"></p>
          <label for="technologies" class="mt-3 block">Technologies</label>
          <input
            id="technologies"
            type="text"
            required
            class="border p-2 w-full rounded-md border-slate-300"
          />
          <p id="technologies-error" class="text-red-600"></p>
          <label for="difficulty" class="mt-3 block">Difficult�</label>
          <select
            id="difficulty"
            required
            class="border p-2 w-full rounded-md border-slate-300"
          >
            <option value="">Choisissez un niveau</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
          <p id="difficulty-error" class="text-red-600"></p>
          <button
            id="generate-plan"
            type="submit"
            disabled
            class="mt-4 rounded bg-blue-600 p-2 text-white disabled:opacity-50"
          >
            G�n�rer le plan de d�veloppement
          </button>
        </form>
      </section>
    </main>
    <dialog id="modal" class="m-auto rounded border p-4">
      <label for="api-key">Cl� API</label>
      <input id="api-key" type="password" class="my-3 block border p-2" />
      <button id="save-key" class="rounded bg-blue-600 p-2 text-white">
        Enregistrer
      </button>
      <button id="demo-mode" class="rounded border p-2">Mode d�mo</button>
      <button id="close-modal" class="rounded border p-2">Fermer</button>
    </dialog>
  </body>
</html>
