<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLANIT AI | Projet</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/ui.js" defer></script>
  </head>
  <body class="bg-slate-50">
    <header class="flex flex-wrap items-center justify-between bg-sky-100 p-5">
      <a href="index.html" class="font-bold"
        ><img
          src="data/Logo minimaliste PLANIT IA.png"
          alt="Planit IA"
          width="120"
      /></a>
      <nav class="flex flex-wrap gap-5" aria-label="Navigation principale">
        <a href="index.html" class="rounded-sm font-bold px-4 py-2"
          >Dashboard</a
        >
        <a href="new-project.html" class="rounded-sm font-bold px-4 py-2"
          >Nouveau Projet</a
        >
        <button
          id="parametre-ia"
          type="button"
          class="rounded-lg bg-blue-600 px-4 py-2 text-white"
        >
          Param�tres IA
        </button>
      </nav>
    </header>
    <main class="p-4">
      <h1 id="board-title" class="text-xl font-bold">Projet</h1>
      <p id="board-error" class="text-red-600" role="alert"></p>
      <p id="project-summary" class="my-3" aria-live="polite"></p>
      <progress
        id="project-progress"
        max="100"
        value="0"
        aria-label="Progression"
      ></progress>
      <div id="kanban" class="mt-4 flex flex-wrap gap-4">
        <section class="min-w-56 flex-1 rounded border p-4">
          <h2 class="font-bold">To Do</h2>
          <div id="todo-list"></div>
        </section>
        <section class="min-w-56 flex-1 rounded border p-4">
          <h2 class="font-bold">In Progress</h2>
          <div id="progress-list"></div>
        </section>
        <section class="min-w-56 flex-1 rounded border p-4">
          <h2 class="font-bold">Done</h2>
          <div id="done-list"></div>
        </section>
      </div>
    </main>
    <dialog id="modal" class="m-auto rounded border p-4">
      <label for="api-key">Cl� API</label>
      <input id="api-key" type="password" class="my-3 block border p-2" />
      <button id="save-key" class="rounded bg-blue-600 p-2 text-white">
        Enregistrer
      </button>
      <button id="demo-mode" class="rounded border p-2">Mode d�mo</button>
      <button id="close-modal" class="rounded border p-2">Fermer</button>
    </dialog>
  </body>
</html>
